name: Release

on:
  push:
    tags:
      - "v*"
  # Explicit dispatch (e.g. from tag-on-version) — GITHUB_TOKEN tag pushes
  # do not start other workflows by themselves.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (optional; defaults to the checked-out ref)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifacts: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.deb
              apps/desktop/dist/latest-linux.yml
          - os: windows-latest
            target: win
            artifacts: |
              apps/desktop/dist/*-setup.exe
              apps/desktop/dist/*-setup.exe.blockmap
              apps/desktop/dist/latest.yml
          - os: macos-latest
            target: mac
            artifacts: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.dmg.blockmap
              apps/desktop/dist/*-mac.zip
              apps/desktop/dist/*-mac.zip.blockmap
              apps/desktop/dist/latest-mac.yml

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Windows)
        if: matrix.target == 'win'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm --filter @consoleri/desktop build:win

      # notarytool --key needs a filesystem path. Secrets store base64 (or PEM) of the .p8.
      # Prefer API Key credentials; do not mix with Apple ID + TEAM_ID (credential conflict).
      - name: Prepare macOS notarization credentials
        if: matrix.target == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${MAC_CSC_LINK:-}" || -z "${MAC_CSC_KEY_PASSWORD:-}" ]]; then
            echo "::error::MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD missing. Without a Developer ID Application .p12, electron-builder falls back to Apple Development and Apple notarization rejects the archive. See docs/source/ci-secrets.rst."
            exit 1
          fi
          if [[ -n "${APPLE_API_KEY_SECRET:-}" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER:-}" ]]; then
            KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            if [[ "${APPLE_API_KEY_SECRET}" == *"BEGIN PRIVATE KEY"* ]]; then
              printf '%s\n' "${APPLE_API_KEY_SECRET}" > "${KEY_PATH}"
            else
              printf '%s' "${APPLE_API_KEY_SECRET}" | base64 --decode > "${KEY_PATH}"
            fi
            chmod 600 "${KEY_PATH}"
            {
              echo "APPLE_API_KEY=${KEY_PATH}"
              echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            } >> "${GITHUB_ENV}"
            echo "Notarization strategy: App Store Connect API key"
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            {
              echo "APPLE_ID<<EOF"
              echo "${APPLE_ID}"
              echo "EOF"
              echo "APPLE_APP_SPECIFIC_PASSWORD<<EOF"
              echo "${APPLE_APP_SPECIFIC_PASSWORD}"
              echo "EOF"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            } >> "${GITHUB_ENV}"
            echo "Notarization strategy: Apple ID + app-specific password"
          else
            echo "::error::macOS notarization secrets incomplete. Set APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER (preferred), or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID."
            exit 1
          fi

      - name: Build (macOS)
        if: matrix.target == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: pnpm --filter @consoleri/desktop build:mac

      - name: Build (Linux)
        if: matrix.target == 'linux'
        run: pnpm --filter @consoleri/desktop build:linux

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.target }}
          # Installers only — not unpacked Electron trees (helper .exe noise).
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      - name: Build HTML
        run: sphinx-build -W -b html docs/source docs/build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          # Need CHANGELOG.md from the tagged commit
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true

      - name: Extract changelog for this version
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if node scripts/changelog-section.mjs "$TAG" > release-notes.md; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "Extracted CHANGELOG notes for $TAG"
            cat release-notes.md
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "No Keep-a-Changelog section for $TAG — using GitHub-generated notes"
            : > release-notes.md
          fi

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          files: |
            dist-artifacts/**/*-setup.exe
            dist-artifacts/**/*-setup.exe.blockmap
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.dmg.blockmap
            dist-artifacts/**/*-mac.zip
            dist-artifacts/**/*-mac.zip.blockmap
            dist-artifacts/**/*.AppImage
            dist-artifacts/**/*.deb
            dist-artifacts/**/latest.yml
            dist-artifacts/**/latest-mac.yml
            dist-artifacts/**/latest-linux.yml
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
